name: Bot safety tests

on:
  pull_request:
    paths:
      - "requirements.txt"
      - "*.py"
      - ".github/workflows/bot-safety-tests.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "requirements.txt"
      - "*.py"
      - ".github/workflows/bot-safety-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run risk and research safety tests
        run: python -m unittest test_logger test_risk test_research_scanner test_live_readiness test_dependency_audit_runner -v

      - name: Run signal tests
        run: python -m pytest test_signals.py -v
